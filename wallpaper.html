<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #020617; color: #fff; font-family: sans-serif; padding: 15px; }
        .title { color: #38bdf8; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .thumb { width: 100%; height: 90px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; object-fit: cover; }
        .thumb:hover { border-color: #38bdf8; }
        .input-box { display: flex; gap: 8px; }
        input { flex-grow: 1; background: #0f172a; border: 1px solid #00f0ff; border-radius: 6px; padding: 8px; color: #fff; outline: none; font-size: 12px; }
        button { background: #0284c7; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: #00f0ff; color: #000; }
    </style>
</head>
<body>
<div class="title">Select Desktop Space Wallpaper</div>
<div class="grid">
    <img class="thumb" src="https://unsplash.com" onclick="setWp(this.src)">
    <img class="thumb" src="https://unsplash.com" onclick="setWp(this.src)">
    <img class="thumb" src="https://unsplash.com" onclick="setWp(this.src)">
    <img class="thumb" src="img/32.png" onclick="setWp(this.src)">
</div>
<div class="input-box">
    <input type="text" id="wp-url" placeholder="Paste custom image link...">
    <button onclick="setCustom()">Inject</button>
</div>
<script>
    function setWp(url) { window.parent.postMessage({type: 'SET_WALLPAPER', url: url}, '*'); }
    function setCustom() { const val = document.getElementById('wp-url').value; if(val) setWp(val); }
</script>
</body>
</html>
