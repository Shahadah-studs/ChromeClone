<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShahadahOS | Beta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100vw; height: 100vh; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #020617; }
        
        .desktop { 
            width: 100%; 
            height: calc(100% - 52px); 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            position: relative;
            padding: 15px;
            background-position: center;
            background-size: cover;
        }

        .desktop::before {
            content: ''; position: absolute; top: 20%; left: 25%; width: 300px; height: 300px;
            background: #0284c7; filter: blur(150px); opacity: 0.2; pointer-events: none;
        }
        .desktop::after {
            content: ''; position: absolute; bottom: 20%; right: 25%; width: 300px; height: 300px;
            background: #00f0ff; filter: blur(150px); opacity: 0.15; pointer-events: none;
        }

        .desktop-icons { display: flex; flex-direction: column; gap: 15px; align-items: flex-start; }
        .shortcut { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100px; height: 100px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; text-align: center; color: #00f0ff; font-size: 11px; font-weight: 600; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); transition: all 0.2s; gap: 6px; }
        .shortcut:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); color: #fff; }
        .shortcut svg { width: 40px; height: 40px; filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.5)); }

        .window { position: absolute; top: 12%; left: 15%; width: 700px; height: 500px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.15); display: none; flex-direction: column; overflow: hidden; border: 2px solid #38bdf8; z-index: 10; }
        .window.focused { box-shadow: 0 0 35px rgba(0, 240, 255, 0.4); border-color: #00f0ff; z-index: 20; }
        .window-header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 16px; cursor: move; border-bottom: 1px solid rgba(0, 240, 255, 0.3); }
        .window-title { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #00f0ff; font-weight: bold; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .window-title svg { width: 16px; height: 16px; }
        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 28px; height: 24px; background: transparent; border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .win-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .win-btn.close:hover { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .window-body { flex-grow: 1; background: #020617; width: 100%; height: 100%; position: relative; color: #fff; }
        .window-body iframe { width: 100%; height: 100%; border: none; }

        #calc-window { width: 320px; height: 460px; }
        #notepad-window { width: 600px; height: 450px; }
        #wallpaper-window { width: 480px; height: 350px; }

        .taskbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 52px; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(20px); border-top: 2px solid #00f0ff; display: flex; justify-content: center; align-items: center; z-index: 9999; box-shadow: 0 -5px 20px rgba(0, 240, 255, 0.2); }
        .taskbar-center { display: flex; align-items: center; gap: 12px; }
        .taskbar-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; color: #00f0ff; }
        .taskbar-icon:hover { background: rgba(0, 240, 255, 0.15); border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); transform: translateY(-2px); }
        .taskbar-icon.active { background: rgba(0, 240, 255, 0.2); border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
        .taskbar-icon svg { width: 26px; height: 26px; }

        .taskbar-right { position: absolute; right: 16px; display: flex; align-items: center; gap: 15px; color: #00f0ff; font-size: 12px; padding: 5px 12px; height: 75%; border-radius: 6px; border: 1px solid rgba(0, 240, 255, 0.2); text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
        .system-time { text-align: right; line-height: 1.3; font-weight: 600; }

        .start-menu { position: fixed; bottom: -650px; left: 50%; transform: translateX(-50%); width: 520px; height: 520px; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(25px); border: 2px solid #00f0ff; border-radius: 16px; box-shadow: 0 0 35px rgba(0, 240, 255, 0.3); transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); z-index: 9998; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .start-menu.open { bottom: 68px; }
        .start-search { width: 100%; padding: 12px 20px; border-radius: 25px; background: rgba(0, 0, 0, 0.6); border: 1px solid #00f0ff; color: #fff; font-size: 14px; outline: none; }
        .start-search:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        .apps-section-title { font-size: 13px; color: #38bdf8; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px rgba(56, 189, 248, 0.4); }
        .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 5px; }
        .app-item { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #00f0ff; font-size: 11px; font-weight: 500; cursor: pointer; padding: 12px; border-radius: 8px; border: 1px solid transparent; transition: all 0.2s; text-align: center; }
        .app-item:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; color: #fff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .app-item svg { width: 32px; height: 32px; }
    </style>
</head>
<body>
       <div id="whatsNewPopup" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(4, 6, 6, 0.85); display: flex; justify-content: center; align-items: center; z-index: 10000;">
    <div style="background: rgba(4, 12, 6, 0.98); width: 100%; max-width: 600px; border: 8px solid #10b981; outline: 8px solid #4ade80; box-shadow: 0 0 35px #10b981; padding: 30px; position: relative; text-align: center;">
        
     
        <button onclick="document.getElementById('whatsNewPopup').style.display='none'" style="position: absolute; top: -20px; right: -20px; background: #0b1f10; color: #ff007f; border: 4px solid #ff007f; padding: 10px 14px; font-size: 0.9rem; font-family: 'Press Start 2P', monospace; cursor: pointer; box-shadow: 4px 4px 0px #000;">X</button>
        
        
        <h2 style="font-size: 1.2rem; font-family: 'Press Start 2P', monospace; color: #ffff00; text-shadow: 0 0 10px #ffff00; margin-bottom: 20px;">Welcome to ShahadahOS!</h2>
        
   
    </div>
    </div>

    <div class="desktop" id="desktop">
        <div class="desktop-icons">
            <div class="shortcut" onclick="openApp('chrome-window')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg>
                <span>ChromeCloneX</span>
            </div>
            <div class="shortcut" onclick="openApp('notepad-window')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>NotePad</span>
            </div>
            <div class="shortcut" onclick="openApp('calc-window')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="14" x2="8" y2="18"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="8" y1="10" x2="8" y2="10"/></svg>
                <span>Calculator</span>
            </div>
            <div class="shortcut" onclick="openApp('wallpaper-window')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>Wallpaper<br>settings</span>
            </div>
        </div>

        <div id="chrome-window" class="window" onclick="focusWindow('chrome-window')">
            <div class="window-header" onmousedown="dragStart(event, 'chrome-window')">
                <div class="window-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                    <span>ChromeCloneX Browser Engine</span>
                </div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('chrome-window')">─</button>
                    <button class="win-btn" onclick="maximizeApp('chrome-window')">🗖</button>
                    <button class="win-btn close" onclick="closeApp('chrome-window')">✕</button>
                </div>
            </div>
            <div class="window-body"><iframe src="browser.html"></iframe></div>
        </div>

        <div id="notepad-window" class="window" onclick="focusWindow('notepad-window')">
            <div class="window-header" onmousedown="dragStart(event, 'notepad-window')">
                <div class="window-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
                    <span>Notepad</span>
                </div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('notepad-window')">─</button>
                    <button class="win-btn close" onclick="closeApp('notepad-window')">✕</button>
                </div>
            </div>
            <div class="window-body"><iframe src="notepad.html"></iframe></div>
        </div>

        <div id="calc-window" class="window" onclick="focusWindow('calc-window')">
            <div class="window-header" onmousedown="dragStart(event, 'calc-window')">
                <div class="window-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="14" x2="8" y2="18"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="8" y1="10" x2="8" y2="10"/></svg>
                    <span>Calculator</span>
                </div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('calc-window')">─</button>
                    <button class="win-btn close" onclick="closeApp('calc-window')">✕</button>
                </div>
            </div>
            <div class="window-body"><iframe src="calc.html"></iframe></div>
        </div>

        <div id="wallpaper-window" class="window" onclick="focusWindow('wallpaper-window')">
            <div class="window-header" onmousedown="dragStart(event, 'wallpaper-window')">
                <div class="window-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    <span>Wallpaper Customizer</span>
                </div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('wallpaper-window')">─</button>
                    <button class="win-btn close" onclick="closeApp('wallpaper-window')">✕</button>
                </div>
            </div>
            <div class="window-body"><iframe src="wallpaper.html"></iframe></div>
        </div>
    </div>

    <div class="start-menu" id="start-menu">
        <input type="text" class="start-search" placeholder="Search apps, files, settings...">
        <div class="apps-section-title">Pinned Applications</div>
        <div class="apps-grid">
            <div class="app-item" onclick="toggleStartMenu(); openApp('chrome-window');">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg>
                <span>ChromeCloneX</span>
            </div>
            <div class="app-item" onclick="toggleStartMenu(); openApp('notepad-window');">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
                <span>Notepad</span>
            </div>
            <div class="app-item" onclick="toggleStartMenu(); openApp('calc-window');">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
                <span>Calculator</span>
            </div>
            <div class="app-item" onclick="toggleStartMenu(); openApp('wallpaper-window');">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                <span>Wallpapers</span>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-center">
            <div class="taskbar-icon" onclick="toggleStartMenu()" id="start-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
            <div class="taskbar-icon" onclick="openApp('chrome-window')" id="chrome-taskbar-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg>
            </div>
            <div class="taskbar-icon" onclick="openApp('notepad-window')" id="notepad-taskbar-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
            </div>
            <div class="taskbar-icon" onclick="openApp('calc-window')" id="calc-taskbar-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
            </div>
            <div class="taskbar-icon" onclick="openApp('wallpaper-window')" id="wallpaper-taskbar-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </div>
        </div>
        <div class="taskbar-right">
            <div class="system-time">
                <div id="time-clock">00:00 AM</div>
                <div id="date-clock">10/31/2026</div>
            </div>
        </div>
    </div>
    <script src="os.js"></script>
</body>
</html>
