<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #020617; color: #fff; overflow: hidden; }
        .browser-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        
        /* Tabs Bar Area */
        .tabs-bar { display: flex; background: #0b1329; padding: 6px 6px 0 6px; gap: 4px; overflow-x: auto; align-items: flex-end; border-bottom: 1px solid rgba(0, 240, 255, 0.1); }
        .tabs-bar::-webkit-scrollbar { height: 4px; }
        .tabs-bar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 2px; }
        .tab { display: flex; align-items: center; background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 8px 8px 0 0; min-width: 120px; max-width: 180px; font-size: 12px; cursor: pointer; gap: 8px; border: 1px solid rgba(0, 240, 255, 0.1); border-bottom: none; transition: all 0.2s; }
        .tab:hover { background: rgba(56, 189, 248, 0.1); color: #fff; }
        .tab.active { background: #0f172a; color: #00f0ff; font-weight: bold; border-color: #00f0ff; border-bottom: 1px solid #0f172a; box-shadow: 0 -2px 8px rgba(0, 240, 255, 0.1); }
        .tab-title { flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }
        .close-tab { background: transparent; border: none; color: inherit; font-size: 10px; cursor: pointer; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
        .close-tab:hover { background: rgba(255,255,255,0.2); color: #ef4444; }
        .new-tab-btn { background: #1e293b; border: 1px solid rgba(0, 240, 255, 0.2); color: #00f0ff; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 4px; }
        .new-tab-btn:hover { background: #00f0ff; color: #020617; box-shadow: 0 0 8px #00f0ff; }

        /* Navigation Toolbar */
        .toolbar { display: flex; align-items: center; background: #0f172a; padding: 8px 12px; gap: 10px; border-bottom: 1px solid rgba(0, 240, 255, 0.3); }
        .nav-buttons { display: flex; gap: 6px; }
        .btn { background: transparent; border: none; color: #00f0ff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .btn svg { width: 16px; height: 16px; }
        
        .address-bar-wrapper { flex-grow: 1; display: flex; align-items: center; background: #020617; border-radius: 20px; padding: 6px 16px; border: 1px solid #00f0ff; box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2); }
        .address-bar-wrapper:focus-within { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .address-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 13px; outline: none; }
        
        /* Viewport Container for View Frames */
        .viewports-container { flex-grow: 1; position: relative; background: #fff; }
        .browser-iframe { width: 100%; height: 100%; border: none; background: #fff; display: none; }
        .browser-iframe.active { display: block; }
    </style>
</head>
<body>
<div class="browser-container">
    <!-- Tabs Header Row -->
    <div class="tabs-bar" id="tabs-bar">
        <!-- Dynamic Tabs Inject Here -->
        <button class="new-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <!-- Navigation Ribbon Bar -->
    <div class="toolbar">
        <div class="nav-buttons">
            <button class="btn" onclick="refreshCurrentTab()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg></button>
            <button class="btn" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        </div>
        <div class="address-bar-wrapper">
            <input type="text" id="address-input" class="address-input" placeholder="Search Google or input URL...">
        </div>
    </div>

    <!-- Frame Views Container -->
    <div class="viewports-container" id="viewports-container">
        <!-- Dynamic Iframes Inject Here -->
    </div>
</div>

<script>
    const tabsBar = document.getElementById('tabs-bar');
    const container = document.getElementById('viewports-container');
    const input = document.getElementById('address-input');
    const HOME = 'https://google.com';
    
    let tabs = [];
    let activeTabId = null;

    function createNewTab(url = HOME) {
        const id = 'tab-' + Date.now() + Math.floor(Math.random() * 1000);
        
        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.id = 'node-' + id;
        tabEl.onclick = () => switchTab(id);
        tabEl.innerHTML = `<span class="tab-title" id="title-${id}">New Tab</span><button class="close-tab" onclick="closeTab(event, '${id}')">✕</button>`;
        
        const iframeEl = document.createElement('iframe');
        iframeEl.className = 'browser-iframe';
        iframeEl.id = 'frame-' + id;
        iframeEl.src = 'about:blank';
        
        tabsBar.insertBefore(tabEl, tabsBar.lastElementChild);
        container.appendChild(iframeEl);
        
        tabs.push({ id: id, url: url });
        switchTab(id);
        navigate(url);
    }

    function switchTab(id) {
        activeTabId = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.browser-iframe').forEach(f => f.classList.remove('active'));
        
        const activeTab = document.getElementById('node-' + id);
        const activeFrame = document.getElementById('frame-' + id);
        
        if(activeTab && activeFrame) {
            activeTab.classList.add('active');
            activeFrame.classList.add('active');
            const data = tabs.find(t => t.id === id);
            input.value = (data.url === HOME) ? '' : data.url;
        }
    }

    function closeTab(e, id) {
        e.stopPropagation();
        if(tabs.length <= 1) return;

        const tabEl = document.getElementById('node-' + id);
        const frameEl = document.getElementById('frame-' + id);
        tabEl.remove();
        frameEl.remove();

        const index = tabs.findIndex(t => t.id === id);
        tabs = tabs.filter(t => t.id !== id);

        if(activeTabId === id) {
            const nextActiveIndex = index > 0 ? index - 1 : 0;
            switchTab(tabs[nextActiveIndex].id);
        }
    }

    function navigate(target) {
        if(!activeTabId) return;
        let url = target.trim();
        if(!url) return;
        
        const isUrl = url.includes('.') && !url.includes(' ');
        if (!isUrl) {
            url = `https://google.com{encodeURIComponent(url)}&igu=1`;
        } else if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        
        if (url.includes('google.com') && !url.includes('igu=1')) {
            url = url.includes('?') ? `${url}&igu=1` : `${url}?igu=1`;
        }
        
        const currentData = tabs.find(t => t.id === activeTabId);
        currentData.url = url;
        input.value = (url === HOME) ? '' : url;
        
        const frame = document.getElementById('frame-' + activeTabId);
        frame.src = url;

        let displayTitle = url.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
        if(url.includes('://google.com')) displayTitle = "Google Search";
        if(url === HOME) displayTitle = "Google";
        document.getElementById(`title-${activeTabId}`).innerText = displayTitle;
    }

    function refreshCurrentTab() {
        if(!activeTabId) return;
        const frame = document.getElementById('frame-' + activeTabId);
        frame.src = frame.src;
    }

    function goHome() {
        navigate(HOME);
    }

    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') navigate(input.value); });
    
    // Initial Setup Tab Open Loop
    createNewTab(HOME);
</script>
</body>
</html>
