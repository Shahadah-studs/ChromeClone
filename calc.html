<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator | Beta</title>
    <meta charset="UTF-8">
    <style>
        body, html { width: 100%; height: 100%; margin: 0; background: #020617; font-family: sans-serif; display: flex; justify-content: center; align-items: center; }
        .calc { width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; padding: 12px; }
        .screen { width: 100%; height: 70px; background: #020617; border: 1px solid #38bdf8; border-radius: 6px; color: #00f0ff; text-align: right; padding: 15px; font-size: 24px; outline: none; margin-bottom: 12px; box-shadow: inset 0 0 5px rgba(0,240,255,0.2); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex-grow: 1; }
        button { background: #1e293b; border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; transition: all 0.1s; }
        button:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; color: #00f0ff; }
        button.op { color: #38bdf8; background: #1e293b; }
        button.eq { background: #0284c7; color: #fff; grid-column: span 2; }
        button.eq:hover { background: #00f0ff; color: #000; }
    </style>
</head>
<body>
<div class="calc">
    <input type="text" class="screen" id="display" readonly value="0">
    <div class="grid">
        <button class="op" onclick="clearScr()">C</button>
        <button class="op" onclick="press('/')">/</button>
        <button class="op" onclick="press('*')">*</button>
        <button class="op" onclick="press('-')">-</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="op" onclick="press('+')">+</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('.')">.</button>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('0')">0</button>
        <button class="eq" onclick="calc()">=</button>
    </div>
</div>
<script>
    const scr = document.getElementById('display');
    let state = '';
    function press(v) { if(scr.value === '0' && !isNaN(v)) state = ''; state += v; scr.value = state; }
    function clearScr() { state = ''; scr.value = '0'; }
    function calc() { try { state = eval(state).toString(); scr.value = state; } catch(e) { scr.value = 'Error'; state = ''; } }
</script>
</body>
</html>
