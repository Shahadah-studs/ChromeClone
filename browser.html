<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, sans-serif; background: #020617; color: #fff; overflow: hidden; }
        .browser-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        
        .toolbar { display: flex; align-items: center; background: #0f172a; padding: 8px 12px; gap: 10px; border-bottom: 1px solid rgba(0, 240, 255, 0.3); }
        .nav-buttons { display: flex; gap: 6px; }
        .btn { background: transparent; border: none; color: #00f0ff; font-size: 16px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn:hover { background: rgba(0, 240, 255, 0.15); text-shadow: 0 0 8px #00f0ff; }
        
        .address-bar-wrapper { flex-grow: 1; display: flex; align-items: center; background: #020617; border-radius: 20px; padding: 6px 16px; border: 1px solid #00f0ff; box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2); }
        .address-bar-wrapper:focus-within { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .address-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 13px; outline: none; }
        
        .viewport { flex-grow: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>
<div class="browser-container">
    <div class="toolbar">
        <div class="nav-buttons">
            <button class="btn" id="refresh-btn">↻</button>
            <button class="btn" id="home-btn">🏠</button>
        </div>
        <div class="address-bar-wrapper">
            <input type="text" id="address-input" class="address-input" placeholder="Search Google or input URL...">
        </div>
    </div>
    <div class="viewport">
        <iframe id="viewport-iframe" src="about:blank"></iframe>
    </div>
</div>
<script>
    const iframe = document.getElementById('viewport-iframe');
    const input = document.getElementById('address-input');
    const HOME = 'https://google.com';

    function navigate(target) {
        let url = target.trim();
        if(!url) return;
        
        const isUrl = url.includes('.') && !url.includes(' ');
        if (!isUrl) {
            url = `https://google.com{encodeURIComponent(url)}&igu=1`;
        } else if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        
        if (url.includes('google.com') && !url.includes('igu=1')) {
            url = url.includes('?') ? `${url}&igu=1` : `${url}?igu=1`;
        }
        
        input.value = url;
        iframe.src = url;
    }

    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') navigate(input.value); });
    document.getElementById('home-btn').addEventListener('click', () => navigate(HOME));
    document.getElementById('refresh-btn').addEventListener('click', () => iframe.src = iframe.src);
    
    navigate(HOME);
</script>
</body>
</html>
